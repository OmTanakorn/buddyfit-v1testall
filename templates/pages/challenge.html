{% extends '_base.html' %}
{% load static %}


{% block title %}Challenge{% endblock title %}

{% block content %}

<div class="HQ_container">
  
  <div class="game-container" >
    <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
    <div id="game-container" ></div>
    <script src="{% static 'js/gameChallenge.js'%}"></script>
    <script src="{% static 'js/gameChallengeStart.js'%}"></script>
    <script src="{% static 'js/gameChallengeEnd.js'%}"></script>
    <script>
      const config = {
        type: Phaser.AUTO,
        width: 800, // ปรับความกว้างตามความเหมาะสม
        height: 600, // ปรับความสูงตามความเหมาะสม
        parent: 'game-container',
        physics : {
          default : "arcade",
          arcade: {
            debug: false, // ตั้ง true เพื่อโชว์กรอบ hitbox ตอน debug
          },
        },
        scene: [gameStart, gamec, gameEnd] // นำ Scene ที่สร้างขึ้นเข้ามาในเกม
    };
    
    //สร้างเกม
    const game = new Phaser.Game(config);
    </script>
  </div>

  <div class= "Mediapipe-container">
    <canvas class="output" width="400px" height="400px"></canvas>
    <button type="button" class="change-btn" id="doneButton"><h1>Replay</h1></button>
    
    {% comment %} สำหรับบันทึกค่า {% endcomment %}
    <form action="{% url 'pages:update_score' %}" method="post" id="doneForm">
      {% csrf_token %}
      <input type="hidden"  name="score" id="endScore" value="0">
      <button class="save-btn"><h1>Done</h1></button>
    </form>
    
    <video class="input_video" width="0px" height="0px" style="visibility: hidden" muted playsinline></video>
    
    <div class="loading">
      <div class="spinner"></div>
    </div>
    <script type="module" src="{% static 'js/challenge.js' %}"></script>

    <script>
      let latestScore = 0;
      const form = document.getElementById("doneForm");
      const scoreInput = document.getElementById("endScore");

      window.addEventListener("buddyfit:challenge-complete", function (event) {
        latestScore = event.detail.score;
        scoreInput.value = latestScore;
      });

      form.addEventListener("submit", function () {
        scoreInput.value = latestScore;
      });

      document.getElementById("doneButton").addEventListener("click", async function () {
        scoreInput.value = latestScore;
        try {
          const response = await fetch(form.action, {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "X-CSRFToken": form.elements.csrfmiddlewaretoken.value,
            },
            body: new URLSearchParams({score: latestScore}),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          window.location.reload();
        } catch (error) {
          console.error("บันทึกคะแนนไม่สำเร็จ", error);
        }
      });
    </script>
    

  </div>
{% endblock content %}
