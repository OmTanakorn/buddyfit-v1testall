{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Set Password{% endblock title %}

{% block content %}
<section class="panel simple-card">
<h1>ตั้งรหัสผ่าน</h1>
<form method="POST" action="" class="password_set">
  {% csrf_token %}
  {{ form | crispy }}
  <div class="form-actions">
    <button class="button button-primary" type="submit" name="action" value="Set Password">บันทึกรหัสผ่าน</button>
  </div>
</form>
</section>
{% endblock content %}
