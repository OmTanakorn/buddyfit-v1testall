{% extends '_base.html' %}
{% block title %}ออกจากระบบ · BuddyFit{% endblock %}
{% block content %}
<section class="panel simple-card">
  <p class="eyebrow">SEE YOU SOON</p>
  <h1>ต้องการออกจากระบบ?</h1>
  <p style="color:var(--muted)">พัฒนาการทั้งหมดของคุณถูกบันทึกไว้ แล้วกลับมาฝึกกับ Buddy อีกนะ</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button class="button button-danger" type="submit">ออกจากระบบ</button>
    <a class="button button-ghost" href="/">กลับหน้าหลัก</a>
  </form>
</section>
{% endblock content %}
