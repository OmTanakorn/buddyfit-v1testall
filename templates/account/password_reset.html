{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Password Reset{% endblock %}

{% block content %}
<section class="panel simple-card">
  <p class="eyebrow">RECOVER ACCOUNT</p>
  <h2>ลืมรหัสผ่าน?</h2>
  <p style="color:var(--muted)">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้คุณ</p>
  <form method="POST" action="{% url 'account_reset_password' %}" class="password_reset">
    {% csrf_token %}
    {{ form | crispy }}
    <button class="button button-primary" type="submit">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
  </form>
</section>
{% endblock content %}
