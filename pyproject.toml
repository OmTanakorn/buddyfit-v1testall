[project]
name = "buddyfit"
version = "1.0.0"
description = "A gamified fitness tracker powered by webcam pose detection"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crispy-bootstrap5==2026.3",
    "django~=5.2.0",
    "django-allauth==65.19.0",
    "django-cors-headers==4.9.0",
    "django-crispy-forms==2.7",
    "gunicorn==26.0.0",
    "psycopg[binary]==3.3.4",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==7.1.0",
]

[tool.uv]
package = false
